name: Deploy to STRATO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strato-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://casagrande.de

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STRATO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/strato"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/strato"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy with SFTP
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
        run: |
          lftp <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set sftp:connect-program "ssh -a -x -i $HOME/.ssh/strato -o BatchMode=yes -o IdentitiesOnly=yes -o UpdateHostKeys=no -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          open -u "$STRATO_USER," "sftp://$STRATO_HOST:22"
          mirror --reverse --verbose --parallel=4 dist/ public/
          bye
          LFTP

      - name: Verify deployment
        run: |
          curl --fail --silent --show-error https://casagrande.de/ > /dev/null
          curl --fail --silent --show-error https://casagrande.de/blog/ > /dev/null
